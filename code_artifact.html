                "sites": {
                    title: "🌐 공식 인터랙티브 맵 바로가기",
                    icon: "🗺️",
                    description: "야생의 숨결 및 왕국의 눈물 사당/코로그 위치 인터랙티브 지도",
                    type: "article",
                    content: "하이랄 전역의 사당, 코로그의 열매, 보스 위치를 완벽하게 찾을 수 있는 공식 지도 사이트입니다.<br><br>" +

                             "• <a href='https://www.zeldadungeon.net/tears-of-the-kingdom-interactive-map/?z=5&x=190&y=-230' target='_blank' class='inline-block bg-portal-green text-portal-gold font-bold px-6 py-3 rounded-xl hover:bg-opacity-90 shadow-md transition'>🗺️ [왕국의 눈물(TotK) 공식 인터랙티브 맵 바로가기]</a>"
                }

        };

        let currentPath = [];

        function getNodeByPath(path) {
            let current = encyclopediaData;
            for (let key of path) {
                if (current && current.children && current.children[key]) {
                    current = current.children[key];
                } else {
                    return null;
                }
            }
            return current;
        }

        function navigateTo(index) {
            if (index === -1) {
                currentPath = [];
            } else {
                currentPath = currentPath.slice(0, index + 1);
            }
            render();
        }

        function clickChild(key) {
            currentPath.push(key);
            render();
        }

        function render() {
            const breadcrumbsEl = document.getElementById('breadcrumbs');
            const contentArea = document.getElementById('content-area');

            // Breadcrumbs
            breadcrumbsEl.innerHTML = '';
            const homeItem = document.createElement('button');
            homeItem.className = `hover:text-portal-green font-bold transition-colors ${currentPath.length === 0 ? 'text-portal-green underline' : ''}`;
            homeItem.innerText = '🏠 홈';
            homeItem.onclick = () => navigateTo(-1);
            breadcrumbsEl.appendChild(homeItem);

            let tempPath = [];
            currentPath.forEach((key, idx) => {
                tempPath.push(key);
                const node = getNodeByPath(tempPath);
                if (node) {
                    const separator = document.createTextNode(' / ');
                    breadcrumbsEl.appendChild(separator);

                    const crumbBtn = document.createElement('button');
                    crumbBtn.className = `hover:text-portal-green font-bold transition-colors ${idx === currentPath.length - 1 ? 'text-portal-green underline' : ''}`;
                    crumbBtn.innerText = node.title;
                    crumbBtn.onclick = () => navigateTo(idx);
                    breadcrumbsEl.appendChild(crumbBtn);
                }
            });

            // Main Content
            contentArea.innerHTML = '';
            const currentNode = getNodeByPath(currentPath);

            if (!currentNode) {
                contentArea.innerHTML = '<p class="text-center text-red-500 py-10">페이지를 찾을 수 없습니다.</p>';
                return;
            }

            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'w-full animate-fadeIn';

            if (currentNode.type === 'category' || !currentNode.type) {
                const titleHeader = document.createElement('div');
                titleHeader.className = 'mb-8 border-b border-gray-200 pb-4';
                titleHeader.innerHTML = `
                    <h2 class="text-2xl md:text-3xl font-bold text-portal-green font-cinzel flex items-center gap-3">
                        <span>${currentNode.icon || '📖'}</span> ${currentNode.title}
                    </h2>
                    ${currentNode.description ? `<p class="text-gray-600 mt-2">${currentNode.description}</p>` : ''}
                `;
                contentWrapper.appendChild(titleHeader);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

                if (currentNode.children) {
                    for (let key in currentNode.children) {
                        const child = currentNode.children[key];
                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-2xl p-6 shadow-sm hover:shadow-xl border border-gray-200 hover:border-portal-gold transition-all duration-300 cursor-pointer flex flex-col justify-between group';
                        card.onclick = () => clickChild(key);

                        card.innerHTML = `
                            <div>
                                <div class="text-4xl mb-4 group-hover:scale-110 transition-transform duration-200">${child.icon || '📜'}</div>
                                <h3 class="text-xl font-bold text-portal-green group-hover:text-portal-gold transition-colors mb-2">${child.title}</h3>
                                <p class="text-gray-500 text-sm leading-relaxed">${child.description || '세부 내용을 확인하려면 클릭하세요.'}</p>
                            </div>
                            <div class="mt-6 flex items-center text-sm font-bold text-portal-gold">
                                <span>자세히 보기</span>
                                <span class="ml-2 transform group-hover:translate-x-1 transition-transform">→</span>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                }
                contentWrapper.appendChild(grid);

                if (currentPath.length > 0) {
                    const backBtn = document.createElement('button');
                    backBtn.className = 'mt-10 bg-gray-200 text-gray-700 px-6 py-3 rounded-full hover:bg-gray-300 transition-colors font-bold flex items-center gap-2';
                    backBtn.innerHTML = '<span>←</span> 이전 목록으로';
                    backBtn.onclick = () => navigateTo(currentPath.length - 2);
                    contentWrapper.appendChild(backBtn);
                }
            } 
            else if (currentNode.type === 'article') {
                const articleBox = document.createElement('div');
                articleBox.className = 'bg-white rounded-2xl p-8 shadow-sm border border-gray-200 article-content';
                articleBox.innerHTML = `
                    <div class="border-b border-gray-100 pb-6 mb-6">
                        <span class="text-portal-gold font-bold text-sm tracking-widest uppercase mb-1 block">Master Compendium & Guide</span>
                        <h2 class="text-3xl font-bold text-portal-green font-cinzel">${currentNode.title}</h2>
                        <p class="text-gray-500 mt-2">${currentNode.description || ''}</p>
                    </div>
                    <div class="text-gray-700 text-base space-y-4 leading-relaxed">
                        ${currentNode.content}
                    </div>
                `;
                contentWrapper.appendChild(articleBox);

                const backBtn = document.createElement('button');
                backBtn.className = 'mt-8 bg-portal-green text-white px-8 py-3 rounded-full hover:bg-portal-greenHover transition-colors font-bold shadow-md hover:shadow-lg flex items-center gap-2';
                backBtn.innerHTML = '<span>←</span> 목록으로 돌아가기';
                backBtn.onclick = () => navigateTo(currentPath.length - 2);
                contentWrapper.appendChild(backBtn);
            }

            contentArea.appendChild(contentWrapper);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
